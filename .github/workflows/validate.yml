name: Validate Skills

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate catalog and skills
        run: python3 scripts/validate.py

      - name: List skills (smoke test)
        run: python3 scripts/list-skills.py --format json | python3 -m json.tool
