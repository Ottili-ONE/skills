name: Validate Skills

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate catalog and skills
        run: python3 scripts/validate.py

      - name: Catalogue must be GENERATED from the skills/ folders
        run: |
          set -euo pipefail
          node scripts/gen-catalog.mjs --check

      - name: List skills (smoke test)
        run: python3 scripts/list-skills.py --format json | python3 -m json.tool

      - name: Validate skill folders against the agentskills.io standard
        run: python3 scripts/validate_skill.py --all

      - name: Install problem-json checker dependency
        run: pip install jsonschema

      - name: Orchestrator preamble is up to date
        run: node scripts/gen-preamble.mjs --check

      - name: Run orchestrator contract tests
        run: |
          set -euo pipefail
          for t in tests/orchestrator/*.test.mjs; do
            echo "=== $t ==="
            node "$t"
          done

      - name: Run engineering skill self-tests
        shell: bash
        run: |
          set -euo pipefail
          for t in \
            skills/engineering/pg-rls-multitenant/scripts/check_rls_migration_test.py \
            skills/engineering/shared-tree-git/scripts/check_shared_tree_test.py \
            skills/engineering/module-contract-first/scripts/check_contract_drift_test.py \
            skills/engineering/outbox-idempotency/scripts/check_outbox_test.py \
            skills/engineering/foundation-v2-conformance/scripts/check_foundation_tokens_test.py \
            skills/engineering/honest-status/scripts/check_status_evidence_test.py \
            skills/engineering/playwright-a11y-e2e/scripts/check_axe_evidence_test.py \
            skills/engineering/playwright-a11y-e2e/scripts/check_workaround_markers_test.py \
            skills/engineering/acceptance-harness/scripts/check_audit_selectors_test.py \
            skills/engineering/acceptance-harness/scripts/report_result_test.py \
            skills/engineering/problem-json-contracts/scripts/check_problem_catalogue_test.py \
            skills/engineering/long-test-discipline/scripts/run_long_test_test.sh \
            skills/engineering/tests/test_collection_acceptance.py \
            skills/engineering/tests/test_research_design_acceptance.py ; do
            echo "=== $t ==="
            python3 "$t"
          done
