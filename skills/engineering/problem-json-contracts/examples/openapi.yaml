openapi: 3.1.0
info:
  title: Ottili API
  version: 1.0.0
paths:
  /things:
    post:
      responses:
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /things/{thingId}:
    get:
      responses:
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
components:
  schemas:
    Problem:
      type: object
      required: ["type", "title", "status"]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
